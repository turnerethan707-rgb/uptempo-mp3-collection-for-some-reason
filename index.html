<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FancyGate Reports</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#252c36; --fg:#c9d1d9; --accent:#00ffc8; --pink:#ff50c8; --muted:#6e7681; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 "SF Mono",Consolas,monospace; }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; }
  header h1 { margin:0; font-size:16px; color:var(--accent); letter-spacing:.5px; }
  #status { font-size:12px; color:var(--muted); }
  #status.ok { color:var(--accent); }
  #status.err { color:var(--pink); }
  button { background:var(--panel); color:var(--fg); border:1px solid var(--line); padding:6px 12px; border-radius:4px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  main { padding:24px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:14px 16px; margin-bottom:12px; }
  .card h2 { margin:0 0 8px; font-size:13px; color:var(--pink); }
  .row { display:grid; grid-template-columns:160px 1fr; gap:8px; padding:2px 0; }
  .row .k { color:var(--muted); }
  .row .v { color:var(--fg); word-break:break-all; }
  .empty { color:var(--muted); text-align:center; padding:48px 0; }
  code { background:#0b0f14; padding:1px 5px; border-radius:3px; color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>FANCYGATE // REPORTS</h1>
  <span id="status">loading…</span>
  <span style="flex:1"></span>
  <button id="refresh">Refresh</button>
</header>
<main id="list"><div class="empty">loading…</div></main>

<script>
const FN = "/.netlify/functions/collect";
const statusEl = document.getElementById("status");
const listEl = document.getElementById("list");

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || "";
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}

function render(reports) {
  if (!reports.length) {
    listEl.innerHTML = '<div class="empty">no reports yet</div>';
    return;
  }
  listEl.innerHTML = reports.map(r => {
    const rows = Object.entries(r.data || {}).map(([k,v]) =>
      `<div class="row"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`
    ).join("");
    return `<div class="card">
      <h2>${esc(r.tag || "report")} · ${esc(r.timestamp || "")}</h2>
      ${rows}
    </div>`;
  }).join("");
}

async function load() {
  setStatus("loading…");
  try {
    const res = await fetch(FN, { method: "GET" });
    if (!res.ok) throw new Error(res.status + " " + res.statusText);
    const data = await res.json();
    setStatus(data.count + " report(s)", "ok");
    render(data.reports || []);
  } catch (err) {
    setStatus("error: " + err.message, "err");
    listEl.innerHTML = `<div class="empty">failed to load. check function deployed at <code>${FN}</code></div>`;
  }
}

document.getElementById("refresh").addEventListener("click", load);
load();
</script>
</body>
</html>
